<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="manifest" href="manifest.json">
  <title>New Tab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    #clock {
      font-size: 80px;
      font-weight: 200;
      letter-spacing: -2px;
      color: #ffffff;
    }

    #date {
      font-size: 16px;
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #search-form {
      margin-top: 16px;
    }

    #search-input {
      width: 400px;
      padding: 12px 20px;
      font-size: 16px;
      border: 1px solid #333;
      border-radius: 24px;
      background: #1a1a1a;
      color: #e0e0e0;
      outline: none;
      transition: border-color 0.2s;
    }

    #search-input::placeholder {
      color: #555;
    }

    #search-input:focus {
      border-color: #555;
    }

    #links {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 600px;
    }

    .link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #888;
      transition: color 0.2s;
    }

    .link:hover {
      color: #e0e0e0;
    }

    .link-icon {
      width: 40px;
      height: 40px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: border-color 0.2s;
    }

    .link:hover .link-icon {
      border-color: #444;
    }

    .link-label {
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div id="clock"></div>
  <div id="date"></div>

  <form id="search-form" action="https://www.google.com/search" method="get" target="_self">
    <input
      id="search-input"
      type="text"
      name="q"
      placeholder="Search Google..."
      autocomplete="off"
      autofocus
    >
  </form>

  <div id="links">
    <a class="link" href="https://github.com" target="_blank">
      <div class="link-icon">GH</div>
      <span class="link-label">GitHub</span>
    </a>
    <a class="link" href="https://mail.google.com" target="_blank">
      <div class="link-icon">GM</div>
      <span class="link-label">Gmail</span>
    </a>
    <a class="link" href="https://youtube.com" target="_blank">
      <div class="link-icon">YT</div>
      <span class="link-label">YouTube</span>
    </a>
    <a class="link" href="https://reddit.com" target="_blank">
      <div class="link-icon">RD</div>
      <span class="link-label">Reddit</span>
    </a>
    <a class="link" href="https://news.ycombinator.com" target="_blank">
      <div class="link-icon">HN</div>
      <span class="link-label">HN</span>
    </a>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}`;

      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months = ['January','February','March','April','May','June',
                      'July','August','September','October','November','December'];
      const day = days[now.getDay()];
      const month = months[now.getMonth()];
      const date = now.getDate();
      document.getElementById('date').textContent = `${day}, ${month} ${date}`;
    }

    updateClock();
    setInterval(updateClock, 1000);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>

</body>
</html>
